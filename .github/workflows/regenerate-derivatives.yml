name: Regenerate derivatives

# CITATION.cff is generated from codemeta.json by CMTools (`cmt`). Keeping it
# current used to depend on someone remembering to run `make build`, so it
# drifted. This regenerates it on every push to main and commits the result,
# which means codemeta.json is the only file anyone needs to edit -- and
# nobody needs cmt installed locally.
#
# README.md is deliberately NOT derived. It is hand-written and owned by this
# repository: repository details propagate only to machine-readable files.
#
# IMPORTANT: only hash-free outputs belong in DERIVED. cmt interpolates the
# current git HEAD into the installer scripts via gitReleaseHash(), so
# regenerating those produces a diff on every commit -- including this
# workflow's own -- and would never converge. src/version.js had the same
# problem and is no longer tracked at all; `deno task build` generates it.

on:
  push:
    branches: [main]
    paths:
      - 'codemeta.json'
      - 'CITATION.cff'
      - '.github/workflows/regenerate-derivatives.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never let two reconciliations race for the same branch.
concurrency:
  group: regenerate-derivatives
  cancel-in-progress: false

env:
  CMT_VERSION: 0.0.46
  DERIVED: CITATION.cff

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      # cmt reads the version from codemeta.json and shells out to
      # `git log -n 1`, so it needs a git checkout -- depth 1 is enough.
      - uses: actions/checkout@v7

      # The copyright year is not something that should be bumped every
      # January. A notice names the year of first publication; adding a year
      # is only meaningful when there is new copyrightable material, and it
      # is a deliberate decision, not maintenance. So this does not rewrite
      # anything -- it fails only when the two places that state the year
      # disagree with each other, and otherwise just leaves a note.
      - name: Check the copyright year
        run: |
          META="$(python3 -c "import json;print(json.load(open('codemeta.json'))['copyrightYear'])")"
          LINE="$(grep -m1 -E '^Copyright' LICENSE.txt)"
          FILE="$(echo "$LINE" | grep -oE '[0-9]{4}' | tail -n 1)"

          if [ "$META" != "$FILE" ]; then
            {
              echo "### Copyright year mismatch"
              echo
              echo "| source | year |"
              echo "|---|---|"
              echo "| \`codemeta.json\` \`copyrightYear\` | $META |"
              echo "| \`LICENSE.txt\` | $FILE |"
              echo
              echo "These must agree. Update whichever is wrong."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::copyright year disagrees: codemeta.json says $META, LICENSE.txt says $FILE"
            exit 1
          fi

          NOW="$(date -u +%Y)"
          if [ "$FILE" -lt "$NOW" ]; then
            echo "::notice::Copyright year is $FILE and it is now $NOW. That is fine if there is no new copyrightable material this year; if there is, update LICENSE.txt and codemeta.json together."
          fi

      - name: Cache cmt
        id: cache-cmt
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/cmt
          key: cmt-${{ env.CMT_VERSION }}-linux-x86_64

      - name: Install cmt
        if: steps.cache-cmt.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o /tmp/cmt.zip \
            "https://github.com/caltechlibrary/CMTools/releases/download/v${CMT_VERSION}/CMTools-v${CMT_VERSION}-Linux-x86_64.zip"
          unzip -q -j /tmp/cmt.zip 'bin/cmt' -d ~/.local/bin
          chmod +x ~/.local/bin/cmt

      - name: Regenerate from codemeta.json
        run: |
          "$HOME/.local/bin/cmt" codemeta.json $DERIVED

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- $DERIVED; then
            echo "Derivatives already match codemeta.json; nothing to do."
            echo "### Already current" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No derivative differed from codemeta.json." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Regenerated from codemeta.json"
            echo
            echo '```'
            git diff --stat -- $DERIVED
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Regenerated:"
          git diff --stat -- $DERIVED
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $DERIVED
          git commit -m "Regenerate derived files from codemeta.json"
          # Pushes made with GITHUB_TOKEN do not trigger workflow runs, so
          # this cannot recurse.
          git push
