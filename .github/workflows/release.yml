name: Draft release

# Cuts a draft GitHub release whenever codemeta.json names a version that has
# not been released yet. codemeta.json is the single source of truth: bump
# `version` and write `releaseNotes`, push, and everything below is mechanical.
#
# A human still publishes the draft. That is the one irreversible step -- once
# published, people download it, and publishing is what triggers the CDN
# upload -- so it stays a deliberate click rather than a side effect.

on:
  push:
    branches: [main]
    paths:
      - 'codemeta.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CMT_VERSION: 0.0.46

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from codemeta.json
        id: v
        run: |
          VERSION="$(jq -r .version codemeta.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::codemeta.json has no version"; exit 1
          fi
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"      >> "$GITHUB_OUTPUT"

      # Draft releases do not create their tag until they are published, so
      # checking for the tag alone would re-cut a draft on every push.
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "${{ steps.v.outputs.tag }} already exists (draft or published); nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: denoland/setup-deno@v2
        if: steps.check.outputs.exists == 'false'
        with:
          deno-version: v2.x

      - name: Install cmt
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -fsSL -o /tmp/cmt.zip \
            "https://github.com/caltechlibrary/CMTools/releases/download/v${CMT_VERSION}/CMTools-v${CMT_VERSION}-Linux-x86_64.zip"
          unzip -q -j /tmp/cmt.zip 'bin/cmt' -d /usr/local/bin
          chmod +x /usr/local/bin/cmt

      # cmt resolves its output format from the exact filename and can only
      # write to the repository root, so generate there and move the file into
      # src/ -- which is what mod.js imports and what gets bundled.
      - name: Stamp src/version.js
        if: steps.check.outputs.exists == 'false'
        run: |
          cmt codemeta.json version.js
          mv version.js src/version.js
          if git diff --quiet -- src/version.js; then
            echo "src/version.js already current."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/version.js
            git commit -m "Stamp src/version.js for ${{ steps.v.outputs.tag }}"
            git push
          fi

      - name: Build the distribution
        if: steps.check.outputs.exists == 'false'
        run: |
          deno task build
          # Ship every component individually as well as the combined bundle.
          # The old Makefile listed only four of them by hand.
          cp README.md about.md INSTALL.md LICENSE CITATION.cff codemeta.json dist/
          cd dist
          zip -q "cl-web-components-${{ steps.v.outputs.version }}.zip" \
            *.js *.md LICENSE CITATION.cff codemeta.json
          unzip -l "cl-web-components-${{ steps.v.outputs.version }}.zip"

      - name: Create the draft release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r .releaseNotes codemeta.json > /tmp/notes.md
          gh release create "${{ steps.v.outputs.tag }}" \
            --draft \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --target "$(git rev-parse HEAD)" \
            "dist/cl-web-components-${{ steps.v.outputs.version }}.zip"
          echo "Draft ${{ steps.v.outputs.tag }} created. Review and publish it to trigger the CDN upload."
