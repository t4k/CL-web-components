name: codemeta drift

# The files below are derived from codemeta.json by CMTools (`cmt`), but
# regenerating them depends on someone remembering to run `make build`. This
# checks that they still match their source, so drift is caught in review
# instead of shipping.
#
# NOTE: only hash-free outputs are checked. cmt interpolates the current git
# HEAD into version.js, Makefile, website.mak and the installer scripts via
# gitReleaseHash(), so those differ on every commit and cannot be compared
# this way.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'codemeta.json'
      - 'README.md'
      - 'CITATION.cff'
      - 'about.md'
      - '.github/workflows/codemeta.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CMT_VERSION: 0.0.46
  DERIVED: README.md CITATION.cff about.md

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # cmt reads the project version from codemeta.json and shells out to
      # `git log -n 1`, so it needs a git checkout -- depth 1 is enough.
      - uses: actions/checkout@v7

      - name: Cache cmt
        id: cache-cmt
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/cmt
          key: cmt-${{ env.CMT_VERSION }}-linux-x86_64

      - name: Install cmt
        if: steps.cache-cmt.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o /tmp/cmt.zip \
            "https://github.com/caltechlibrary/CMTools/releases/download/v${CMT_VERSION}/CMTools-v${CMT_VERSION}-Linux-x86_64.zip"
          unzip -q -j /tmp/cmt.zip 'bin/cmt' -d ~/.local/bin
          chmod +x ~/.local/bin/cmt

      - name: Regenerate derived files
        run: |
          "$HOME/.local/bin/cmt" codemeta.json $DERIVED

      - name: Fail if derived files drifted from codemeta.json
        run: |
          if git diff --quiet -- $DERIVED; then
            echo "Derived files are up to date with codemeta.json."
            exit 0
          fi
          echo "::error::Derived files are stale. Regenerate with: make build"
          git diff --stat -- $DERIVED
          echo
          echo "--- full diff ---"
          git diff -- $DERIVED
          exit 1

      - name: Upload regenerated files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-from-codemeta
          path: |
            README.md
            CITATION.cff
            about.md
