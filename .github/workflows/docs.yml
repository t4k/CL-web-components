name: Build and deploy docs

# `make website` assembles the whole published site into _site/ -- Pandoc
# output from docs/*.md and ./*.md, hand-written demo pages, runtime assets
# and the Pagefind index.
# This uploads that directory straight to GitHub Pages: no `gh-pages`
# branch, no `publish.bash`, no merge prompt.
#
# Pull requests run the build but skip the deploy, so a change that breaks
# the docs build fails in review rather than after merge.
#
# NOTE: this only takes effect once a repo admin sets
# Settings -> Pages -> Source to "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned so CI output matches the HTML currently committed to the repo.
  PANDOC_VERSION: 3.8.2.1
  PAGEFIND_VERSION: 1.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pandoc
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -n 1

      - name: Install Pagefind
        run: npm install -g "pagefind@${PAGEFIND_VERSION}"

      - name: Build site
        run: make website

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Pull requests build but do not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
