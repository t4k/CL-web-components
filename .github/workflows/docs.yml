name: Build and deploy docs

# Builds the documentation site and publishes it to GitHub Pages: no
# `gh-pages` branch, no `publish.bash`, no merge prompt.
#
# The build lives here rather than in a website.mak on purpose. CMTools
# generates website.mak and renders ./*.md beside its sources, so keeping the
# build there would mean a `cmt` run could silently revert this layout.
# Nothing in this repository reads website.mak, so it can be regenerated
# freely without affecting the published site.
#
# The same applies to pandoc/. cmt generates page.tmpl, links-to-html.lua and
# add-col-scope.lua into the repository root; this build reads the copies in
# pandoc/, so any root copies a `cmt` run leaves behind are inert.
#
# Pull requests run the build but skip the deploy, so a change that breaks
# the docs build fails in review rather than after merge.
#
# NOTE: this only takes effect once a repo admin sets
# Settings -> Pages -> Source to "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned so CI output matches the HTML currently committed to the repo.
  PANDOC_VERSION: 3.8.2.1
  PAGEFIND_VERSION: 1.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pandoc
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -n 1

      - name: Install Pagefind
        run: npm install -g "pagefind@${PAGEFIND_VERSION}"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Bundle components
        run: deno task build

      - name: Render Markdown
        run: |
          mkdir -p _site
          # docs/*.md is hand-written documentation; ./*.md is generated by
          # cmt, which can only write to the repository root. Both render
          # flat into _site/ so every relative link keeps resolving.
          for SRC in docs/*.md *.md; do
            BASE="$(basename "$SRC" .md)"
            OUT="_site/$BASE.html"
            [ "$BASE" = "README" ] && OUT="_site/index.html"
            echo "$SRC -> $OUT"
            pandoc --metadata title="$BASE" -s --to html5 "$SRC" -o "$OUT" \
              --lua-filter=pandoc/links-to-html.lua \
              --lua-filter=pandoc/add-col-scope.lua \
              --template=pandoc/page.tmpl
          done

      - name: Copy pages and assets
        run: |
          cp -p docs/demo_*.html docs/*test*.html _site/
          # dist/*.js are the freshly built bundles; mod.js is the documented
          # ES module entry point and imports from src/, which is copied too.
          cp -p dist/*.js mod.js LICENSE _site/
          cp -Rp css src _site/

      - name: Build search index
        run: |
          pagefind --site _site --force-language en-US \
            --exclude-selectors "nav,header,footer"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Pull requests build but do not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
