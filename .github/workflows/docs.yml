name: Build and deploy docs

# Builds the documentation site the same way `make website` does locally
# (Pandoc + Pagefind) and publishes it straight to GitHub Pages as an
# artifact -- no `gh-pages` branch, no `publish.bash`, no merge prompt.
#
# NOTE: this only takes effect once a repo admin sets
# Settings -> Pages -> Source to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned so CI output matches the HTML currently committed to the repo.
  PANDOC_VERSION: 3.8.2.1
  PAGEFIND_VERSION: 1.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pandoc
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -n 1

      - name: Convert Markdown to HTML
        run: make website

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude '.vscode' \
            --exclude 'dist' \
            --exclude 'test' \
            --exclude 'llm_notes' \
            --exclude 'pagefind'

      - name: Build Pagefind search index
        run: |
          npx -y "pagefind@${PAGEFIND_VERSION}" \
            --site _site \
            --output-path _site/pagefind \
            --glob "{*.html,docs/*.html}" \
            --force-language en-US \
            --exclude-selectors "nav,header,footer"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
