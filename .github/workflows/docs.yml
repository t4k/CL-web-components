name: Docs

# The rendering logic lives in caltechlibrary/workflows, so a fix there reaches
# every Caltech Library site without editing this file.
#
# This calls the render-site action rather than the whole docs.yml reusable
# workflow, because the site publishes compiled bundles and a reusable workflow
# gives the caller no way to add a Deno setup step. Everything except the
# toolchain and the Pages plumbing is still shared.
#
# NOTE: pinned to t4k/workflows@main while the shared repository is being proved
# out. This becomes caltechlibrary/workflows@v1.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Bundle components
        run: deno task build

      - uses: t4k/workflows/.github/actions/render-site@main
        with:
          template: pandoc/page.tmpl
          lua-filters: |
            pandoc/links-to-html.lua
            pandoc/add-col-scope.lua
          include: |
            dist/*.js
            mod.js
            LICENSE.txt
            css
            src

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
