name: Probe AWS permissions

# Temporary. Checks whether the OIDC role can read the distribution, which
# would let public-base-url be derived instead of hardcoded.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_ARN }}
          aws-region: us-west-2

      - name: Can the role read the distribution?
        env:
          DIST: ${{ secrets.AWS_DISTRIBUTION_ID }}
        run: |
          if aws cloudfront get-distribution --id "$DIST" \
               --query 'Distribution.DomainName' --output text > /tmp/domain 2>/tmp/err; then
            echo "RESULT: ALLOWED"
            echo "RESULT: default domain is $(cat /tmp/domain)"
            aws cloudfront get-distribution --id "$DIST" \
              --query 'Distribution.DistributionConfig.Aliases.Items' --output text \
              | sed 's/^/RESULT: alias /'
          else
            echo "RESULT: DENIED"
            sed 's/^/RESULT: /' /tmp/err | head -2
          fi
